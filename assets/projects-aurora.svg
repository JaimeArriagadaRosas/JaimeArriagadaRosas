<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="1160" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.5" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#11142A"/>
    </linearGradient>

    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(180 70) rotate(25) scale(420 260)">
      <stop stop-color="#4CE0C0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4CE0C0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(990 470) rotate(205) scale(430 270)">
      <stop stop-color="#8B5CF6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="stroke" x1="70" y1="80" x2="1130" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#56F0D1" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#4F8CFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#A66CFF" stop-opacity="0.52"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#59F0D2"/>
      <stop offset="0.55" stop-color="#63A8FF"/>
      <stop offset="1" stop-color="#AE77FF"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
    </filter>

    <style>
      .title {
        font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        fill: #F5F7FF;
        letter-spacing: 0.4px;
      }
      .subtitle {
        font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        fill: #AAB4C8;
      }
      .kicker {
        font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        fill: #86E8D7;
        letter-spacing: 1.8px;
      }
      .card-title {
        font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        fill: #F7F8FF;
      }
      .repo {
        font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        fill: #D7DEEE;
      }
      .desc {
        font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        fill: #98A6BE;
      }
      .tech {
        font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        fill: #B8C7E2;
      }
      .num {
        font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        fill: #71809B;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="560" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="30" fill="url(#glow1)"/>
  <rect width="1200" height="560" rx="30" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="558" rx="29" stroke="url(#stroke)" stroke-opacity="0.75"/>

  <!-- Header -->
  <text x="64" y="72" class="kicker">WHAT I BUILD</text>
  <text x="64" y="116" class="title">Projects across software, data, AI and education.</text>
  <text x="64" y="146" class="subtitle">A snapshot of the areas I enjoy turning into complete, practical solutions.</text>

  <!-- Card 1 -->
  <g filter="url(#shadow)">
    <rect x="64" y="190" width="516" height="145" rx="20" fill="#0D1526" fill-opacity="0.92"/>
    <rect x="64.5" y="190.5" width="515" height="144" rx="19.5" stroke="url(#stroke)" stroke-opacity="0.45"/>
  </g>
  <rect x="84" y="212" width="42" height="6" rx="3" fill="url(#accent)"/>
  <text x="84" y="242" class="card-title">Education Technology</text>
  <text x="84" y="270" class="repo">Plugin Feedback for Canvas LMS</text>
  <text x="84" y="294" class="desc">LTI feedback workflow with AI-assisted review and instructor control.</text>
  <text x="84" y="317" class="tech">React · Node.js · LTI 1.3 · PostgreSQL · Docker · AI</text>
  <text x="538" y="220" text-anchor="end" class="num">01</text>

  <!-- Card 2 -->
  <g filter="url(#shadow)">
    <rect x="620" y="190" width="516" height="145" rx="20" fill="#0D1526" fill-opacity="0.92"/>
    <rect x="620.5" y="190.5" width="515" height="144" rx="19.5" stroke="url(#stroke)" stroke-opacity="0.45"/>
  </g>
  <rect x="640" y="212" width="42" height="6" rx="3" fill="url(#accent)"/>
  <text x="640" y="242" class="card-title">Frontend Development</text>
  <text x="640" y="270" class="repo">Colegio Horizonte</text>
  <text x="640" y="294" class="desc">Responsive educational website focused on polished interaction and motion.</text>
  <text x="640" y="317" class="tech">React 19 · TypeScript · Vite · Tailwind CSS · Framer Motion</text>
  <text x="1094" y="220" text-anchor="end" class="num">02</text>

  <!-- Card 3 -->
  <g filter="url(#shadow)">
    <rect x="64" y="365" width="516" height="145" rx="20" fill="#0D1526" fill-opacity="0.92"/>
    <rect x="64.5" y="365.5" width="515" height="144" rx="19.5" stroke="url(#stroke)" stroke-opacity="0.45"/>
  </g>
  <rect x="84" y="387" width="42" height="6" rx="3" fill="url(#accent)"/>
  <text x="84" y="417" class="card-title">Machine Learning</text>
  <text x="84" y="445" class="repo">Proyecto 1 ML</text>
  <text x="84" y="469" class="desc">Structured experimentation with datasets, notebooks and reusable code.</text>
  <text x="84" y="492" class="tech">Python · Jupyter Notebook · Machine Learning · Data Analysis</text>
  <text x="538" y="395" text-anchor="end" class="num">03</text>

  <!-- Card 4 -->
  <g filter="url(#shadow)">
    <rect x="620" y="365" width="516" height="145" rx="20" fill="#0D1526" fill-opacity="0.92"/>
    <rect x="620.5" y="365.5" width="515" height="144" rx="19.5" stroke="url(#stroke)" stroke-opacity="0.45"/>
  </g>
  <rect x="640" y="387" width="42" height="6" rx="3" fill="url(#accent)"/>
  <text x="640" y="417" class="card-title">Data Science</text>
  <text x="640" y="445" class="repo">Proyecto Ciencia de Datos FAERS</text>
  <text x="640" y="469" class="desc">Data-science project space for analysis and experimentation.</text>
  <text x="640" y="492" class="tech">Data · Analysis · Exploration · Reproducible workflows</text>
  <text x="1094" y="395" text-anchor="end" class="num">04</text>
</svg>
