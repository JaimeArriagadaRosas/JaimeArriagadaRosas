name: Refresh contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate animated SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: JaimeArriagadaRosas
          outputs: |
            assets/github-snake.svg?palette=github-light&color_snake=#27b8aa
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#68e1d3

      - name: Update generated files on main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/github-snake.svg assets/github-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Snake assets are up to date."
          else
            git commit -m "chore(profile): refresh contribution snake"
            git push origin HEAD:main
          fi
