name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/contribution-snake.yml

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark animated SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: JaimeArriagadaRosas
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#27b8aa
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#68e1d3

      - name: Publish animations to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
