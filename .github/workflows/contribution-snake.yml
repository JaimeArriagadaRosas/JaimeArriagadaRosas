name: Generate contribution assets

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/contribution-snake.yml

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate light and dark animated SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: JaimeArriagadaRosas
          outputs: |
            assets/github-snake.svg?palette=github-light&color_snake=#27b8aa
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#68e1d3

      - name: Generate verified contribution count badges
        uses: actions/github-script@v7
        with:
          script: |
            const { mkdirSync, writeFileSync } = require('node:fs');
            const result = await github.graphql([
              'query($login: String!) {',
              '  user(login: $login) {',
              '    contributionsCollection {',
              '      contributionCalendar { totalContributions }',
              '    }',
              '  }',
              '}',
            ].join('\n'), { login: 'JaimeArriagadaRosas' });
            const total = result.user?.contributionsCollection?.contributionCalendar?.totalContributions;
            if (!Number.isSafeInteger(total) || total < 0) {
              throw new Error('GitHub did not return a valid contribution count.');
            }
            const number = new Intl.NumberFormat('en-US').format(total);
            const makeBadge = (dark) => {
              const bg = dark ? '#0d1117' : '#f6f8fa';
              const border = dark ? '#303d4a' : '#d2d9e1';
              const main = dark ? '#e6edf3' : '#1f2937';
              const muted = dark ? '#9fb3c8' : '#576577';
              const accent = dark ? '#62dfce' : '#0e8c82';
              return [
                '<svg xmlns="http://www.w3.org/2000/svg" width="390" height="82" viewBox="0 0 390 82" role="img" aria-label="' + number + ' contributions in the last year">',
                '<rect x="1" y="1" width="388" height="80" rx="14" fill="' + bg + '" stroke="' + border + '" stroke-width="1.5"/>',
                '<rect x="17" y="17" width="5" height="48" rx="2.5" fill="' + accent + '"/>',
                '<text x="38" y="42" fill="' + main + '" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">' + number + '</text>',
                '<text x="38" y="63" fill="' + muted + '" font-family="Segoe UI, Arial, sans-serif" font-size="13">contributions in the last year</text>',
                '<rect x="311" y="21" width="12" height="12" rx="3" fill="' + accent + '" fill-opacity=".28"/>',
                '<rect x="328" y="21" width="12" height="12" rx="3" fill="' + accent + '" fill-opacity=".55"/>',
                '<rect x="345" y="21" width="12" height="12" rx="3" fill="' + accent + '"/>',
                '<rect x="311" y="38" width="12" height="12" rx="3" fill="' + accent + '" fill-opacity=".18"/>',
                '<rect x="328" y="38" width="12" height="12" rx="3" fill="' + accent + '" fill-opacity=".70"/>',
                '<rect x="345" y="38" width="12" height="12" rx="3" fill="' + accent + '" fill-opacity=".38"/>',
                '<rect x="311" y="55" width="12" height="12" rx="3" fill="' + accent + '" fill-opacity=".48"/>',
                '<rect x="328" y="55" width="12" height="12" rx="3" fill="' + accent + '" fill-opacity=".23"/>',
                '<rect x="345" y="55" width="12" height="12" rx="3" fill="' + accent + '" fill-opacity=".85"/>',
                '</svg>',
              ].join('');
            };
            mkdirSync('assets', { recursive: true });
            writeFileSync('assets/contributions-badge.svg', makeBadge(false), 'utf8');
            writeFileSync('assets/contributions-badge-dark.svg', makeBadge(true), 'utf8');
            core.info('Generated contribution badges for count: ' + total);

      - name: Commit updated assets to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/github-snake.svg assets/github-snake-dark.svg assets/contributions-badge.svg assets/contributions-badge-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution assets are already up to date."
          else
            git commit -m "chore(profile): refresh contribution assets"
            git push origin HEAD:main
          fi

      - name: Remove obsolete output branch
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin output > /dev/null 2>&1; then
            git push origin --delete output
          else
            echo "Legacy output branch already absent."
          fi
